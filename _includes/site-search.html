<div class="form  form--search">
  <form data-search-form role="search">
    <label for="search">Search the archive</label>
    <input class="search-field" id="search" type="search" name="query" placeholder="Try “LockBit”, “injection”, or “Rust”" autocomplete="off" data-search-input>
    <p class="search-status" data-search-status aria-live="polite">Enter at least two characters to search.</p>
    <ul class="search-results" data-search-results></ul>
  </form>
</div>

<script src="{{ "/assets/scripts/search.js" | relative_url }}" defer data-search-endpoint="{{ "/assets/search.json" | relative_url }}"></script>
