# Build settings
plugins:
  - jekyll-sitemap
  - jekyll-mentions
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-default-layout
  - jekyll-feed
  - jemoji
# Site configuration
# 1. Files excluded from Jekyll builds
# 2. Installed Gems
# 3. Gem settings
# 4. Jekyll settings
# 5. Collections
# 6. Jekyll collections settings
# 7. Site settings
# 8. Site favicons & manifest icons
# 9. Site navigation

# 3. Gem settings
paginate: 10 # jekyll-paginate > items per page
paginate_path: /blog/page:num/ # jekyll-paginate > blog page
jekyll-mentions: https://twitter.com # jekyll-mentions > service used when @replying
twitter:
  username: cPeterr # jekyll-seo-tag > Owners twitter username
author:
  name: Chuong Dong
  twitter: cPeterr
social: # jekyll-seo-tag > social overrides
  name: Chuong Dong # jekyll-seo-tag > real name
  links: # jekyll-seo-tag > social aliases (sameAs)
    - https://twitter.com/cPeterr
    - https://github.com/cdong1012

# markdown: CommonMark # Markdown parse settings, CommonMark performs slightly better an others in build time
# commonmark:
#   options: ["SMART", "FOOTNOTES"]
#   extensions: ["strikethrough", "autolink", "table"]

# 4. Jekyll settings
sass:
  style: compressed # Style compression
permalink: pretty # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more --> # Marks end of excerpt in posts
timezone: America/New_York # Timezone for blog posts and alike
date_format: "%b %d, %Y"

# 5. Collections
collections:
  posts:
    title: Blog Posts # Needed for Siteleaf
    output: true
    aside: true
    description: "Deep dives into malware families, reverse engineering techniques, and software internals."
    #feature_text:
    #feature_image: "https://www.10wallpaper.com/wallpaper/2560x1600/1603/Polygon_triangles_green-Design_Thmem_HD_Wallpaper_2560x1600.jpg"

#6. Jekyll collections settings
defaults:
  - scope:
      path: ""
    values:
      image: "/assets/default-social-image.png" # Default image for sharing

# 7. Site settings
encoding: utf-8 # Make sure the encoding is right
lang: en-US # Set the site language
title: "Chuong Dong" # Site name or title, also used in jekyll-seo-tag
tagline: "Security Research"

logo: "/assets/logos/512.png" # Site logo, also used in jekyll-seo-tag
description: "Reverse engineering, malware analysis, and software obfuscation research by Chuong Dong." # Site description and default description, also used in jekyll-seo-tag
url: "https://www.chuongdong.com" # Site url, also used in jekyll-seo-tag
baseurl: ""
repo: "https://github.com/cdong1012/cdong1012.github.io"
repository: "cdong1012/cdong1012.github.io"

# disqus: "alembic-1" # Blog post comments, uncomment the option and set the site ID from your Disqus account
service_worker: false
css_inline: false
manifest:
  theme_color: "#0b1018"
  background_color: "#0b1018"

# 8. Site favicons & manifest icons
favicons: # Favicons are also used in the manifest file. Syntax is 'size: path'
  16: "/assets/logos/16x.png"
  32: "/assets/logos/32x.png"
  96: "/assets/logos/96x.png"
  120: "/assets/logos/120.png"
  144: "/assets/logos/144.png"
  180: "/assets/logos/180.png"
  512: "/assets/logos/512.png"
  1024: "/assets/logos/1024.png"

# 9. Site navigation
navigation_header:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Blog
    url: /blog/
  - title: Categories
    url: /categories/
  - title: Search
    url: /search/

# - title: Fork Alembic
#   url: https://github.com/daviddarnes/alembic

navigation_footer:
  - title: About
    url: /about/
  - title: Blog
    url: /blog/
  - title: RSS
    url: /feed.xml

social_links: # Appears in sidebar. Set the urls then uncomment and comment out as desired
  GitHub: https://github.com/cdong1012
  Twitter: https://twitter.com/cPeterr
  # RSS: /feed.xml

sharing_links: # Appear at the bottom of single blog posts, add as desired. The value can be 'true' or the desired button colour
  Twitter: "#0d94e7"
  Email: true
